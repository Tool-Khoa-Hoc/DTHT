<!doctype html>
<html lang="vi" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#201216" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- ═══════════ SEO ═══════════ -->
  <meta name="description" content="Đấu Trường Học Tập - Nền tảng ôn thi THPTQG, tính điểm xét tuyển đại học, và luyện thi trắc nghiệm dành cho học sinh Việt Nam" />
  <meta name="keywords" content="ôn thi THPT, tính điểm xét tuyển, luyện thi trắc nghiệm, đề thi thử, Đấu Trường Học Tập" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://www.dautruonghoctap.io.vn/" />

  <!-- Open Graph -->
  <meta property="og:title" content="Đấu Trường Học Tập" />
  <meta property="og:description" content="Nền tảng ôn thi THPTQG và tính điểm xét tuyển đại học hàng đầu Việt Nam" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.dautruonghoctap.io.vn/" />
  <meta property="og:image" content="https://www.dautruonghoctap.io.vn/logo.png" />
  <meta property="og:locale" content="vi_VN" />

  <title>Đấu Trường Học Tập - Ôn thi THPTQG &amp; Tính điểm xét tuyển</title>

  <!-- ═══════════ Favicon ═══════════ -->
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/logo.png" />

  <!--
    ═══════════ TASK 1: PRECONNECT — Khai báo sớm các domain quan trọng ═══════════
    Giúp browser mở TCP+TLS handshake NGAY KHI HTML được parse,
    tiết kiệm 100-300ms khi fetch tài nguyên sau này.

    Thứ tự quan trọng:
    1. Supabase (API, Auth, Storage) — critical path cho app
    2. Google Fonts — render-blocking nếu không preconnect
    3. CDN phụ (unpkg cho PDF.js cmaps)
  -->

  <!-- Supabase project -->
  <link rel="preconnect" href="https://szvzwnbdjixcvgbgpavf.supabase.co" crossorigin />
  <!-- Supabase Auth endpoint (khác domain với API) -->
  <link rel="dns-prefetch" href="https://szvzwnbdjixcvgbgpavf.supabase.co" />

  <!-- Google Fonts — phải preconnect CẢ HAI domain -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- unpkg CDN — dùng cho pdfjs cmap files -->
  <link rel="dns-prefetch" href="https://unpkg.com" />

  <!--
    ═══════════ TASK 1: PRELOAD — Ưu tiên tài nguyên LCP ═══════════
    `rel="preload"` báo browser tải ngay với priority cao nhất,
    KHÔNG block parser, KHÔNG thực thi — chỉ cache trước.

    Ưu tiên theo thứ tự:
    1. Logo (LCP element — visible above-the-fold ngay khi load)
    2. Font primary weight 700 (heading text — render LCP text)
  -->

  <!-- LCP Image: Logo hiển thị ngay trong header mobile + desktop sidebar -->
  <link
    rel="preload"
    as="image"
    type="image/webp"
    href="/logo.webp"
    fetchpriority="high"
  />

  <!--
    Font preload: tải woff2 của Plus Jakarta Sans 700
    trực tiếp từ gstatic — bypass qua Google Fonts redirect.
    Lưu ý: URL này ổn định và không thay đổi giữa các version Google Fonts.
  -->
  <link
    rel="preload"
    as="font"
    type="font/woff2"
    href="https://fonts.gstatic.com/s/plusjakartasans/v8/LDIbaomQNQcsA88c7O9yZ4KMCoOg4IA6-91aHEjcWuA_m07iRQ.woff2"
    crossorigin
  />

  <!--
    ═══════════ Fonts — NON-BLOCKING (media swap trick) ═══════════
    media="print" → browser không block render để tải
    onload="this.media='all'" → sau khi tải xong thì áp dụng CSS
  -->
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </noscript>

  <!-- Material Symbols — Icon font, không cần block render -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  </noscript>
  <script>
    (() => {
      const markIconsReady = () => document.documentElement.classList.add('icons-ready');

      if (!('fonts' in document) || !document.fonts?.load) {
        markIconsReady();
        return;
      }

      Promise.race([
        document.fonts.load('24px "Material Symbols Outlined"'),
        new Promise((resolve) => window.setTimeout(resolve, 2500)),
      ]).finally(markIconsReady);
    })();
  </script>

  <!--
    ═══════════ CRITICAL CSS INLINE — chống FOUC cho app shell ═══════════
    Chỉ inlining các style tối thiểu cho trạng thái loading ban đầu.
    Không cần đợi CSS bundle → FCP nhanh hơn.
  -->
  <style>
    /* App shell background — khớp với TailwindCSS dark mode var */
    html, body, #root {
      margin: 0;
      padding: 0;
      background-color: #0f0a0c;
      min-height: 100dvh;
    }
    body {
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #boot-shell {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at top right, rgba(227, 100, 136, 0.18), transparent 32%),
        radial-gradient(circle at bottom left, rgba(99, 102, 241, 0.14), transparent 28%),
        linear-gradient(135deg, #201216 0%, #2d1b2e 48%, #1a1025 100%);
      color: #f8fafc;
      transition: opacity 180ms ease, visibility 180ms ease;
      z-index: 9999;
    }
    #boot-shell[data-ready="true"] {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .boot-orb {
      position: absolute;
      border-radius: 999px;
      filter: blur(40px);
      opacity: 0.6;
    }
    .boot-orb.top {
      top: -8%;
      right: -14%;
      width: 260px;
      height: 260px;
      background: rgba(227, 100, 136, 0.22);
    }
    .boot-orb.bottom {
      bottom: 2%;
      left: -12%;
      width: 220px;
      height: 220px;
      background: rgba(99, 102, 241, 0.16);
    }
    .boot-card {
      position: relative;
      width: min(360px, calc(100vw - 32px));
      padding: 28px 24px;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(18, 12, 20, 0.68);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(14px);
      text-align: center;
    }
    .boot-mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, rgba(227, 100, 136, 0.24), rgba(147, 51, 234, 0.22));
      box-shadow: 0 10px 28px rgba(227, 100, 136, 0.14);
    }
    .boot-title {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .boot-copy {
      margin: 0 0 18px;
      color: rgba(226, 232, 240, 0.74);
      font-size: 14px;
      line-height: 1.6;
    }
    .boot-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
    }
    .boot-bar {
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #e36488, #9333ea);
      animation: boot-slide 1.1s ease-in-out infinite;
      transform-origin: left center;
      will-change: transform;
    }
    @keyframes boot-slide {
      0% {
        transform: translateX(-110%);
      }
      100% {
        transform: translateX(290%);
      }
    }
    /* Prevent CLS: giữ không gian cho icon font khi chưa load */
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined', sans-serif;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      inline-size: 1em;
      min-inline-size: 1em;
      block-size: 1em;
      flex-shrink: 0;
      overflow: hidden;
      vertical-align: middle;
    }
    html:not(.icons-ready) .material-symbols-outlined {
      color: transparent !important;
      text-shadow: none !important;
    }
  </style>
</head>

<body>
  <div id="boot-shell" aria-hidden="true">
    <div class="boot-orb top"></div>
    <div class="boot-orb bottom"></div>
    <div class="boot-card">
      <div class="boot-mark">DT</div>
      <h1 class="boot-title">Đang tải giao diện học tập</h1>
      <p class="boot-copy">Đang khởi động nhanh để bạn vào web sớm hơn trên mạng di động.</p>
      <div class="boot-track">
        <div class="boot-bar"></div>
      </div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
