  <script>
    (function () {
      try {
        var theme = localStorage.getItem('dtht_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = theme === 'dark' || (!theme && prefersDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
        var lang = localStorage.getItem('dtht_lang');
        if (lang === 'en' || lang === 'vi') {
          document.documentElement.lang = lang;
          if (lang === 'en') {
            document.title = 'Study Arena (DTHT) - National Exam Prep & University Admissions';
          }
        }
      } catch (e) {}
    })();
  </script>

  <!--
    ═══════════ CRITICAL CSS INLINE — Trung Hoa Sáng & Mặc Dạ Tối ═══════════
    Chống FOUC cho app shell trên nền giấy gạo #FAF7F0 hoặc nghiên mực #12100E.
  -->
  <style>
    html, body, #root {
      margin: 0;
      padding: 0;
      background-color: #FAF7F0;
      color: #1C1917;
      min-height: 100dvh;
    }
    html.dark, html.dark body, html.dark #root {
      background-color: #12100E;
      color: #F5EFE6;
    }
    body {
      font-family: "Be Vietnam Pro", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #boot-shell {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: radial-gradient(circle at 50% 24%, #FDFBF6 0%, #FAF7F0 65%, #F3EDE2 100%);
      color: #1C1917;
      transition: opacity 100ms ease-out, visibility 100ms ease-out;
      z-index: 9999;
    }
    html.dark #boot-shell {
      background: radial-gradient(circle at 50% 24%, #1A1714 0%, #12100E 65%, #0B0A09 100%);
      color: #F5EFE6;
    }
    #boot-shell[data-ready="true"] {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .boot-card {
      position: relative;
      width: min(360px, calc(100vw - 32px));
      padding: 28px 24px;
      border-radius: 16px;
      border: 1px solid #E7E0D2;
      background: #FFFFFF;
      box-shadow: 0 12px 28px -8px rgba(28, 25, 23, 0.08), 0 0 0 1px rgba(201, 162, 39, 0.14);
      text-align: center;
    }
    html.dark .boot-card {
      border: 1px solid #383027;
      background: #1E1A17;
      box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(229, 184, 66, 0.22);
    }
    .boot-mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-family: "Spectral", "Be Vietnam Pro", serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #FFFFFF;
      background: #B91C1C;
      border: 2px solid #C9A227;
      box-shadow: 0 6px 16px rgba(185, 28, 28, 0.22);
    }
    html.dark .boot-mark {
      background: #DC2626;
      border-color: #E5B842;
      box-shadow: 0 6px 16px rgba(220, 38, 38, 0.35);
    }
    .boot-title {
      margin: 0 0 8px;
      font-family: "Spectral", "Be Vietnam Pro", serif;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 800;
      color: #1C1917;
    }
    html.dark .boot-title {
      color: #F5EFE6;
    }
    .boot-copy {
      margin: 0 0 18px;
      color: #57534E;
      font-size: 14px;
      line-height: 1.6;
    }
    html.dark .boot-copy {
      color: #BDB4A5;
    }
    .boot-track {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: #F3EDE2;
      border: 1px solid #E7E0D2;
    }
    html.dark .boot-track {
      background: #27221E;
      border: 1px solid #383027;
    }
    .boot-bar {
      width: 62%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #B91C1C, #C9A227);
    }
    html.dark .boot-bar {
      background: linear-gradient(90deg, #DC2626, #E5B842);
    }
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: 'liga';
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      inline-size: 1em;
      min-inline-size: 1em;
      block-size: 1em;
      flex-shrink: 0;
      overflow: hidden;
      vertical-align: middle;
    }
  </style>
</head>

<body>
  <div id="boot-shell" aria-hidden="true">
    <div class="boot-card">
      <div class="boot-mark">DT</div>
      <h1 class="boot-title" id="boot-title">Đấu Trường Học Tập</h1>
      <p class="boot-copy" id="boot-copy">Đang mở thư phòng ôn luyện mùa thi 2027...</p>
      <div class="boot-track">
        <div class="boot-bar"></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      try {
        if (document.documentElement.lang === 'en') {
          var t = document.getElementById('boot-title');
          var c = document.getElementById('boot-copy');
          if (t) t.textContent = 'Study Arena · DTHT';
          if (c) c.textContent = 'Opening the 2027 scholarly study hall...';
        }
      } catch (e) {}
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
