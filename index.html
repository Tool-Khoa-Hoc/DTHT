  <!-- ═══════════ Favicon ═══════════ -->
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/logo.png" />

  <!--
    ═══════════ TASK 1: PRECONNECT — Khai báo sớm các domain quan trọng ═══════════
    Giúp browser mở TCP+TLS handshake NGAY KHI HTML được parse,
    tiết kiệm 100-300ms khi fetch tài nguyên sau này.

    Thứ tự quan trọng:
    1. Supabase (API, Auth, Storage) — critical path cho app
    2. Google Fonts — render-blocking nếu không preconnect
    3. CDN phụ (unpkg cho PDF.js cmaps)
  -->

  <!-- Supabase Auth endpoint (khác domain với API) -->
  <link rel="dns-prefetch" href="https://szvzwnbdjixcvgbgpavf.supabase.co" />

  <!-- Google Fonts — phải preconnect CẢ HAI domain -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- unpkg CDN — dùng cho pdfjs cmap files -->
  <link rel="dns-prefetch" href="https://unpkg.com" />

  <!--
    ═══════════ TASK 1: PRELOAD — Ưu tiên tài nguyên LCP ═══════════
    `rel="preload"` báo browser tải ngay với priority cao nhất,
    KHÔNG block parser, KHÔNG thực thi — chỉ cache trước.

    Ưu tiên theo thứ tự:
    1. Logo (LCP element — visible above-the-fold ngay khi load)
    2. Font primary weight 700 (heading text — render LCP text)
  -->

  <!-- LCP Image: Logo hiển thị ngay trong header mobile + desktop sidebar -->
  <link
    rel="preload"
    as="image"
    type="image/webp"
    href="/logo.webp"
    fetchpriority="high"
  />

  <!--
    Font preload: tải woff2 của Plus Jakarta Sans 700
    trực tiếp từ gstatic — bypass qua Google Fonts redirect.
    Lưu ý: URL này ổn định và không thay đổi giữa các version Google Fonts.
  -->
  <!--
    ═══════════ Fonts — NON-BLOCKING (media swap trick) ═══════════
    media="print" → browser không block render để tải
    onload="this.media='all'" → sau khi tải xong thì áp dụng CSS
  -->
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet" />
  </noscript>

  <!-- Material Symbols — Icon font, không cần block render -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1&icon_names=account_balance,add,add_chart,add_circle,add_task,admin_panel_settings,all_inclusive,alternate_email,apartment,architecture,arrow_back,arrow_back_ios_new,arrow_downward,arrow_forward,arrow_forward_ios,arrow_outward,arrow_upward,article,assignment_late,auto_awesome,auto_stories,autorenew,backpack,biotech,bolt,calculate,calendar_month,campaign,cancel,category,celebration,check,check_circle,chevron_right,close,code,computer,content_copy,database_off,delete,description,done_all,draft,edit,edit_document,edit_note,edit_square,emoji_events,engineering,error,event_busy,expand_more,experiment,flag,folder,folder_off,folder_open,format_list_bulleted,functions,gavel,gpp_good,grade,grid_view,group,group_add,group_off,groups,history_edu,home,hotel_class,hourglass_empty,how_to_reg,inbox,info,key,language,library_books,link,link_off,local_activity,local_fire_department,local_library,lock,mail,manage_accounts,menu,menu_book,military_tech,model_training,note_alt,notifications,notifications_off,open_in_new,pending_actions,person,person_add,person_off,person_search,picture_as_pdf,play_circle,progress_activity,psychology,public,public_off,quiz,radio_button_unchecked,receipt_long,refresh,restart_alt,rocket_launch,save,schedule,school,science,search,search_off,send,settings,shield,splitscreen,star,support_agent,swords,sync,timeline,topic,trending_up,trophy,tune,upload_file,user_attributes,verified,visibility,warning,workspace_premium&display=block"
    rel="stylesheet"

  />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1&icon_names=account_balance,add,add_chart,add_circle,add_task,admin_panel_settings,all_inclusive,alternate_email,apartment,architecture,arrow_back,arrow_back_ios_new,arrow_downward,arrow_forward,arrow_forward_ios,arrow_outward,arrow_upward,article,assignment_late,auto_awesome,auto_stories,autorenew,backpack,biotech,bolt,calculate,calendar_month,campaign,cancel,category,celebration,check,check_circle,chevron_right,close,code,computer,content_copy,database_off,delete,description,done_all,draft,edit,edit_document,edit_note,edit_square,emoji_events,engineering,error,event_busy,expand_more,experiment,flag,folder,folder_off,folder_open,format_list_bulleted,functions,gavel,gpp_good,grade,grid_view,group,group_add,group_off,groups,history_edu,home,hotel_class,hourglass_empty,how_to_reg,inbox,info,key,language,library_books,link,link_off,local_activity,local_fire_department,local_library,lock,mail,manage_accounts,menu,menu_book,military_tech,model_training,note_alt,notifications,notifications_off,open_in_new,pending_actions,person,person_add,person_off,person_search,picture_as_pdf,play_circle,progress_activity,psychology,public,public_off,quiz,radio_button_unchecked,receipt_long,refresh,restart_alt,rocket_launch,save,schedule,school,science,search,search_off,send,settings,shield,splitscreen,star,support_agent,swords,sync,timeline,topic,trending_up,trophy,tune,upload_file,user_attributes,verified,visibility,warning,workspace_premium&display=block" rel="stylesheet" />
  </noscript>
  <!--
    ═══════════ CRITICAL CSS INLINE — chống FOUC cho app shell ═══════════
    Chỉ inlining các style tối thiểu cho trạng thái loading ban đầu.
    Không cần đợi CSS bundle → FCP nhanh hơn.
  -->
  <style>
    /* App shell background — khớp với TailwindCSS dark mode var */
    html, body, #root {
      margin: 0;
      padding: 0;
      background-color: #0f0a0c;
      min-height: 100dvh;
    }
    body {
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #boot-shell {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: linear-gradient(135deg, #201216 0%, #2d1b2e 48%, #1a1025 100%);
      color: #f8fafc;
      transition: opacity 80ms linear, visibility 80ms linear;
      z-index: 9999;
    }
    #boot-shell[data-ready="true"] {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .boot-orb {
      display: none;
    }
    .boot-orb.top {
      top: -8%;
      right: -14%;
      width: 260px;
      height: 260px;
      background: rgba(227, 100, 136, 0.22);
    }
    .boot-orb.bottom {
      bottom: 2%;
      left: -12%;
      width: 220px;
      height: 220px;
      background: rgba(99, 102, 241, 0.16);
    }
    .boot-card {
      position: relative;
      width: min(360px, calc(100vw - 32px));
      padding: 24px 20px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(18, 12, 20, 0.92);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
      text-align: center;
    }
    .boot-mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, rgba(227, 100, 136, 0.24), rgba(147, 51, 234, 0.22));
      box-shadow: 0 10px 28px rgba(227, 100, 136, 0.14);
    }
    .boot-title {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .boot-copy {
      margin: 0 0 18px;
      color: rgba(226, 232, 240, 0.74);
      font-size: 14px;
      line-height: 1.6;
    }
    .boot-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
    }
    .boot-bar {
      width: 58%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #e36488, #9333ea);
    }
    /* Prevent CLS: giữ không gian cho icon font khi chưa load */
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined', sans-serif;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      inline-size: 1em;
      min-inline-size: 1em;
      block-size: 1em;
      flex-shrink: 0;
      overflow: hidden;
      vertical-align: middle;
    }
  </style>
</head>

<body>
  <div id="boot-shell" aria-hidden="true">
    <div class="boot-orb top"></div>
    <div class="boot-orb bottom"></div>
    <div class="boot-card">
      <div class="boot-mark">DT</div>
      <h1 class="boot-title">Đang tải giao diện học tập</h1>
      <p class="boot-copy">Đang khởi động nhanh để bạn vào web sớm hơn trên mạng di động.</p>
      <div class="boot-track">
        <div class="boot-bar"></div>
      </div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
